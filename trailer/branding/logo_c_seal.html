<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
svg{display:block}
</style></head><body>
<!-- C. The Seal: a new emblem, a brass cog (the steam age) round a cut-away world: the frontier at sunset on its
     crust, a saucer's beam, and under the crust the Hollow with its inner sun; a ribbon carries the name -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="brass" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#fff0b0"/><stop offset=".4" stop-color="#dba648"/><stop offset="1" stop-color="#7a4714"/>
  </linearGradient>
  <linearGradient id="brassDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b9802e"/><stop offset="1" stop-color="#5a3008"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b1640"/><stop offset=".5" stop-color="#9a3a55"/><stop offset="1" stop-color="#ffb35a"/>
  </linearGradient>
  <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a2014"/><stop offset="1" stop-color="#1a0d08"/>
  </linearGradient>
  <radialGradient id="inner" cx=".5" cy=".55" r=".6">
    <stop offset="0" stop-color="#e9fff2"/><stop offset=".25" stop-color="#9fe6c4"/><stop offset="1" stop-color="#1f5a52"/>
  </radialGradient>
  <radialGradient id="sun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff8d8"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="innerSun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#e8ffd0"/><stop offset="1" stop-color="#b8ffd8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c8ffe6" stop-opacity=".8"/><stop offset="1" stop-color="#c8ffe6" stop-opacity=".05"/>
  </linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b5312a"/><stop offset="1" stop-color="#5e1210"/>
  </linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff6d8"/><stop offset="1" stop-color="#f0c879"/>
  </linearGradient>
  <clipPath id="world"><circle cx="0" cy="0" r="150"/></clipPath>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".7"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<g transform="translate(960,430)" filter="url(#shadow)">
  <!-- the cog -->
  <path id="cog" fill="url(#brass)" stroke="#2a1405" stroke-width="5" stroke-linejoin="round"/>
  <circle r="166" fill="url(#brassDark)" stroke="#2a1405" stroke-width="5"/>
  <g id="rivets" fill="#ffe0a0" stroke="#3a1d06" stroke-width="2"></g>
  <!-- the cut-away world -->
  <g clip-path="url(#world)">
    <rect x="-150" y="-150" width="300" height="170" fill="url(#sky)"/>
    <circle cx="-38" cy="-4" r="60" fill="url(#sun)"/>
    <circle cx="-38" cy="-4" r="26" fill="#fff4cc"/>
    <!-- mesas and a cactus on the skyline -->
    <path d="M -150 20 L -150 -10 L -118 -10 L -110 -26 L -64 -26 L -56 -8 L -20 -8 L -14 4 L 30 4 L 38 -18 L 92 -18 L 100 -2 L 150 -2 L 150 20 Z" fill="#2a1424"/>
    <path d="M 58 -18 l 0 -26 a 5 5 0 0 1 10 0 l 0 26 Z M 52 -36 l 0 -8 a 3 3 0 0 1 6 0 l 0 10 Z M 68 -30 l 0 -10 a 3 3 0 0 1 6 0 l 0 8 Z" fill="#2a1424"/>
    <!-- the crust, and the Hollow inside it with its inner sun -->
    <rect x="-150" y="20" width="300" height="140" fill="url(#crust)"/>
    <ellipse cx="0" cy="92" rx="122" ry="56" fill="url(#inner)"/>
    <circle cx="0" cy="96" r="34" fill="url(#innerSun)"/>
    <circle cx="0" cy="96" r="11" fill="#ffffff"/>
    <!-- the Hollow's own hills, around the rim of the hollow, and hanging from its roof -->
    <path d="M -122 92 Q -100 128 -60 140 L -40 132 L -20 142 L 10 136 L 40 144 L 70 134 L 100 124 Q 118 108 122 92 Q 110 150 0 148 Q -110 150 -122 92 Z" fill="#244a3c"/>
    <path d="M -110 66 L -96 74 L -80 64 L -60 76 L -40 66 L -16 72 L 0 62 L 22 72 L 46 64 L 70 74 L 92 66 L 112 72 L 122 88 Q 110 40 0 36 Q -110 40 -122 88 Z" fill="#2f2018"/>
    <!-- the crust's crack where the gateway shaft runs down -->
    <path d="M -4 20 L 4 20 L 2 40 L -2 40 Z" fill="#9ff3ff" opacity=".9"/>
    <!-- the saucer and its beam -->
    <polygon points="72,-92 84,-92 112,4 44,4" fill="url(#beam)"/>
    <g transform="translate(78,-96)">
      <ellipse rx="34" ry="9" fill="#cfd6dc" stroke="#1d262c" stroke-width="2.5"/>
      <path d="M -14 -3 A 14 12 0 0 1 14 -3 Z" fill="#9ff7d6" stroke="#1d262c" stroke-width="2.5"/>
    </g>
    <!-- an airship far off -->
    <g transform="translate(-92,-92)" fill="#2a1424" opacity=".8">
      <ellipse rx="30" ry="9"/><rect x="-10" y="8" width="20" height="5" rx="2"/><path d="M 28 -4 L 38 -10 L 38 10 L 28 4 Z"/>
    </g>
  </g>
  <circle r="150" fill="none" stroke="#2a1405" stroke-width="5"/>
  <!-- the ribbon -->
  <g transform="translate(0,170)">
    <path d="M -330 -6 L -270 -6 L -270 58 L -330 58 L -300 26 Z" fill="#6a1612" stroke="#2a0605" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 330 -6 L 270 -6 L 270 58 L 330 58 L 300 26 Z" fill="#6a1612" stroke="#2a0605" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -290 -30 Q 0 -60 290 -30 L 290 44 Q 0 14 -290 44 Z" fill="url(#ribbon)" stroke="#2a0605" stroke-width="5" stroke-linejoin="round"/>
    <path d="M -278 -20 Q 0 -50 278 -20" fill="none" stroke="#f0c879" stroke-width="2" stroke-dasharray="6 6" opacity=".7"/>
    <path d="M -278 34 Q 0 4 278 34" fill="none" stroke="#f0c879" stroke-width="2" stroke-dasharray="6 6" opacity=".7"/>
    <path id="arc" d="M -270 22 Q 0 -8 270 22" fill="none"/>
    <text font-family="Algerian" font-size="60" letter-spacing="4" text-anchor="middle" fill="url(#cream)" stroke="#2a0605" stroke-width="5" paint-order="stroke">
      <textPath href="#arc" startOffset="50%">HOLLOW FRONTIER</textPath>
    </text>
  </g>
</g>
<g font-family="Bahnschrift, 'Segoe UI'" text-anchor="middle" fill="#f3e3c0">
  <text x="960" y="726" font-size="32" letter-spacing="14" font-weight="600">WILD WEST · STEAM AGE · HOLLOW EARTH</text>
  <text x="960" y="770" font-size="21" letter-spacing="8" fill-opacity=".75">A NEOFORGE MOD FOR MINECRAFT 26.3</text>
</g>
<script>
// The cog's teeth and the rivets round its rim
const teeth = 24, ro = 196, ri = 176;
let d = '';
for (let i = 0; i < teeth; i++) {
  const a0 = (i / teeth) * Math.PI * 2, step = Math.PI * 2 / teeth;
  const pts = [[a0, ri], [a0 + step * .12, ro], [a0 + step * .42, ro], [a0 + step * .54, ri]];
  for (const [a, r] of pts) d += (d ? 'L' : 'M') + (Math.cos(a) * r).toFixed(1) + ' ' + (Math.sin(a) * r).toFixed(1) + ' ';
}
document.getElementById('cog').setAttribute('d', d + 'Z');
const rv = document.getElementById('rivets');
for (let i = 0; i < 16; i++) {
  const a = i / 16 * Math.PI * 2, c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', (Math.cos(a) * 158).toFixed(1)); c.setAttribute('cy', (Math.sin(a) * 158).toFixed(1)); c.setAttribute('r', 4.5);
  rv.appendChild(c);
}
</script>
</svg>
</body></html>
