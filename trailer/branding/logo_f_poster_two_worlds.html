<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
svg{display:block}
</style></head><body>
<!-- F. The Poster, two worlds: the handbill printed in two inks, HOLLOW in the Hollow's teal over a horizon rule,
     FRONTIER in the frontier's brown -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="paper" cx=".5" cy=".45" r=".75">
    <stop offset="0" stop-color="#f3e2b8"/><stop offset=".7" stop-color="#e2c48c"/><stop offset="1" stop-color="#a97a3e"/>
  </radialGradient>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="g"/>
    <feColorMatrix in="g" type="matrix" values="0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .22 0" result="t"/>
    <feComposite in="t" in2="SourceGraphic" operator="in" result="tex"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
  </filter>
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".75"/></filter>
</defs>
<g transform="translate(960,540) rotate(-2.2)" filter="url(#shadow)">
  <g filter="url(#rough)">
    <rect x="-470" y="-330" width="940" height="660" fill="url(#paper)" filter="url(#grain)"/>
  </g>
  <rect x="-438" y="-298" width="876" height="596" fill="none" stroke="#3a1e0a" stroke-width="3" opacity=".7"/>
  <rect x="-428" y="-288" width="856" height="576" fill="none" stroke="#3a1e0a" stroke-width="1.5" opacity=".6"/>
  <g filter="url(#ink)" fill="#2a1406" text-anchor="middle">
    <text y="-200" font-family="Algerian" font-size="62" letter-spacing="18">WANTED</text>
    <text y="-150" font-family="Bahnschrift, 'Segoe UI'" font-size="18" letter-spacing="5" font-weight="600">FOR CRIMES AGAINST CATTLE AND THE NATURAL ORDER</text>
    <!-- the sketch: a saucer over a mesa -->
    <g transform="translate(0,-60)" fill="none" stroke="#2a1406" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <ellipse rx="70" ry="16"/><path d="M -28 -5 A 28 22 0 0 1 28 -5"/>
      <path d="M -48 12 L -90 82 M 48 12 L 90 82" stroke-dasharray="6 8"/>
      <path d="M -220 86 L -170 86 L -158 62 L -110 62 L -100 86 L 120 86 L 132 70 L 190 70 L 200 86 L 230 86"/>
    </g>
    <text y="128" font-family="Algerian" font-size="132" letter-spacing="4" fill="#17606e">HOLLOW</text>
    <rect x="-300" y="150" width="600" height="3" fill="#2a1406" opacity=".75"/>
    <text y="248" font-family="Algerian" font-size="132" letter-spacing="4">FRONTIER</text>
  </g>
  <g fill="#7a1a12" opacity=".85" filter="url(#ink)" text-anchor="middle" transform="translate(300,-200) rotate(14)">
    <rect x="-118" y="-36" width="236" height="64" fill="none" stroke="#7a1a12" stroke-width="5"/>
    <text y="12" font-family="Algerian" font-size="40" letter-spacing="6">REWARD</text>
  </g>
  <!-- nails -->
  <g fill="#5a5a5a" stroke="#222" stroke-width="2">
    <circle cx="-440" cy="-302" r="9"/><circle cx="440" cy="-302" r="9"/><circle cx="-440" cy="302" r="9"/><circle cx="440" cy="302" r="9"/>
  </g>
</g>
<g font-family="Bahnschrift, 'Segoe UI'" text-anchor="middle" fill="#f3e3c0">
  <text x="960" y="940" font-size="30" letter-spacing="14" font-weight="600">WILD WEST · STEAM AGE · HOLLOW EARTH</text>
  <text x="960" y="984" font-size="21" letter-spacing="8" fill-opacity=".8">A NEOFORGE MOD FOR MINECRAFT 26.3</text>
</g>
</svg>
</body></html>
