import javax.imageio.ImageIO
import java.awt.image.BufferedImage

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('com.geckolib') }
    }
    // Optional compat (phase 14): compiled against, never bundled or required.
    exclusiveContent {
        forRepository { maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com/' } }
        filter { includeGroup('mezz.jei'); includeGroup('net.mezzdev.config') }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
    exclusiveContent {
        forRepository { maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' } }
        filter { includeGroup('top.theillusivec4.curios') }
    }
}

base {
    archivesName = mod_id
}

// Dev-only rigs (PhotoBooth, Trailer): their own source set, part of the mod in every dev run but never in the jar.
sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Mojang ships Java 25 to end users in 26.3, so mods target Java 25 (downloaded via foojay if missing).
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // Sign in with a real Microsoft account (own name and skin): the first launch prints a login code, then it's cached
            devLogin = true
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Dev visual check: opens run/saves/hf_photo, stages the mod's mobs, saves run/screenshots/hf_*.png, quits.
        photo {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'hf_photo'
            systemProperty 'hollowfrontier.photo', 'true'
            // -PphotoScene=expedition shoots only the airship and polar gateway scene (quick re-shoots); default: everything
            systemProperty 'hollowfrontier.photo.scene', (project.findProperty('photoScene') ?: 'all').toString()
            // -PphotoFilter=gate,lab narrows a scene that supports it (hollowbuild) to the matching subjects
            systemProperty 'hollowfrontier.photo.filter', (project.findProperty('photoFilter') ?: '').toString()
            if (project.hasProperty('shaders')) {
                systemProperty 'neoforge.disableBlaze3DValidation', 'true' // as the trailer's, for Iris
            }
        }

        // Dev trailer shoot: opens run/saves/hf_trailer, films each shot to trailer/clips/NN_name.mp4, quits (Trailer.java).
        // -PtrailerShots=gallop,shootout re-shoots only those; -PtrailerTown=1 films the next town over.
        // -Pshaders films through Iris and the pack in run/shaderpacks (run/config/iris.properties) into trailer/clips_shaders.
        trailer {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'hf_trailer'
            systemProperty 'hollowfrontier.trailer', 'true'
            systemProperty 'hollowfrontier.trailer.shots', (project.findProperty('trailerShots') ?: 'all').toString()
            systemProperty 'hollowfrontier.trailer.town', (project.findProperty('trailerTown') ?: '0').toString()
            // -PtrailerStreet=search / -PtrailerPasture=search override the pinned main street and pasture (x,z)
            if (project.hasProperty('trailerStreet')) systemProperty 'hollowfrontier.trailer.street', project.property('trailerStreet').toString()
            if (project.hasProperty('trailerPasture')) systemProperty 'hollowfrontier.trailer.pasture', project.property('trailerPasture').toString()
            systemProperty 'hollowfrontier.trailer.out', file(project.hasProperty('shaders') ? 'trailer/clips_shaders' : 'trailer/clips').absolutePath
            if (project.hasProperty('shaders')) {
                systemProperty 'hollowfrontier.trailer.shaders', 'true'
                // Iris 1.11.7 trips the dev-only strict Blaze3D validation (CenterDepthSampler binds no InSampler); players never run it
                systemProperty 'neoforge.disableBlaze3DValidation', 'true'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Headless: runs every hollowfrontier game test, then exits (non-zero on failure).
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.dev)
configurations {
    devCompileOnly.extendsFrom compileOnly
    devImplementation.extendsFrom implementation
}
// build compiles the dev rigs too, so a change in main can't quietly break them
tasks.named('check') { dependsOn tasks.named('devClasses') }
tasks.matching { it.name in ['runPhoto', 'runTrailer', 'runClient'] }.configureEach { dependsOn tasks.named('devClasses') }

// 'localRuntime' = present for dev runs but not published as a dependency (optional compat mods go here).
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Optional compat: APIs at compile time; the full mods only in dev runs (localRuntime), never in the published deps.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Iris's API for compat/iris (GeckoLib's glow pipeline as emissive); the mods themselves only in dev runs with
    // -Pshaders, for filming with a shader pack. Never a dependency of the mod.
    compileOnly "maven.modrinth:iris:${iris_version}"
    if (project.hasProperty('shaders')) {
        localRuntime "maven.modrinth:sodium:${sodium_version}"
        localRuntime "maven.modrinth:iris:${iris_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            geckolib_version       : geckolib_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// MIT: the notice goes with every copy, so the jar carries it (named per mod, so it can't clash in a modpack)
def licenseInJar = "LICENSE_${mod_id}" // resolved now: the configuration cache can't reach project properties at run time
tasks.named('jar', Jar) {
    from('LICENSE') { rename { licenseInJar } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The trailer world: the photo world's seed and settings with none of its chunks, made once (runTrailer opens it by name)
def trailerLevel = file('run/saves/hf_trailer/level.dat')
def prepareTrailerWorld = tasks.register('prepareTrailerWorld', Copy) {
    group = 'hollowfrontier'
    description = 'Creates run/saves/hf_trailer from the photo world\'s level.dat, if it is missing.'
    from('run/saves/hf_photo') { include 'level.dat', 'data/minecraft/world_gen_settings.dat', 'data/minecraft/game_rules.dat' } // 26.3 keeps the seed and rules in data/
    into 'run/saves/hf_trailer'
    onlyIf { !trailerLevel.exists() }
}
tasks.matching { it.name == 'runTrailer' }.configureEach { dependsOn prepareTrailerWorld }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Writes a flat-color 16x16 placeholder PNG (1px darker border) for every texture that is referenced
// by a mod model JSON or listed in placeholders.txt but does not exist yet. Existing files are never touched.
// Run after runData. Every texture still needs an ASSETS.md entry.
abstract class GenPlaceholders extends DefaultTask {
    @InputFiles abstract ConfigurableFileCollection getModelFiles()
    @Internal abstract RegularFileProperty getExtraList()
    @Internal abstract DirectoryProperty getTextureRoot()
    @Input abstract Property<String> getModId()

    @TaskAction
    void run() {
        System.setProperty('java.awt.headless', 'true')
        String ns = modId.get()
        // path -> [width, height]; model refs are 16x16, placeholders.txt lines may add "WxH" (e.g. armor layers 64x32).
        Map<String, int[]> refs = new TreeMap<>()
        // Only texture references: values inside a model's "textures" object (blockstates/items reference model ids, not textures).
        def texturesBlock = ~/(?s)"textures"\s*:\s*\{([^}]*)\}/
        def pattern = ~/"${ns}:((?:block|item|entity|gui|misc|environment|particle)\/[a-z0-9_\/]+)"/
        modelFiles.files.each { f ->
            (f.text =~ texturesBlock).each { block -> (block[1] =~ pattern).each { m -> refs.put(m[1], [16, 16] as int[]) } }
        }
        File extra = extraList.get().asFile
        if (extra.exists()) {
            extra.readLines().collect { it.replace('﻿', '').trim() }.findAll { it && !it.startsWith('#') }.each { line ->
                def parts = line.split(/\s+/)
                def size = parts.length > 1 ? parts[1].toLowerCase().split('x').collect { it as int } : [16, 16]
                refs.put(parts[0], size as int[])
            }
        }
        File root = textureRoot.get().asFile
        int created = 0
        refs.each { String path, int[] size ->
            File out = new File(root, path + '.png')
            if (out.exists()) return
            out.parentFile.mkdirs()
            int w = size[0], ht = size[1]
            int h = path.hashCode()
            int r = 64 + ((h >> 16) & 0x7F), g = 64 + ((h >> 8) & 0x7F), b = 64 + (h & 0x7F)
            int fill = (0xFF << 24) | (r << 16) | (g << 8) | b
            int edge = (0xFF << 24) | ((r >> 1) << 16) | ((g >> 1) << 8) | (b >> 1)
            def img = new BufferedImage(w, ht, BufferedImage.TYPE_INT_ARGB)
            for (int x = 0; x < w; x++) for (int y = 0; y < ht; y++) {
                img.setRGB(x, y, (x == 0 || y == 0 || x == w - 1 || y == ht - 1) ? edge : fill)
            }
            ImageIO.write(img, 'png', out)
            logger.lifecycle("placeholder: textures/${path}.png")
            created++
        }
        logger.lifecycle("genPlaceholders: ${refs.size()} referenced, ${created} created")
    }
}

tasks.register('genPlaceholders', GenPlaceholders) {
    group = 'hollowfrontier'
    description = 'Creates 16x16 placeholder PNGs for missing mod textures.'
    modId = project.mod_id
    modelFiles.from(fileTree('src/generated/resources/assets') { include '*/models/**/*.json' })
    modelFiles.from(fileTree('src/main/resources/assets') { include '*/models/**/*.json' })
    extraList = file('placeholders.txt')
    textureRoot = file("src/main/resources/assets/${project.mod_id}/textures")
}
